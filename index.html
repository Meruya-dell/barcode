<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef2f7;
}

.container{
    width:100%;
    min-height:100vh;
    background:white;
    padding:20px;
}

.header{
    text-align:center;
    color:#1976D2;
    font-size:30px;
    font-weight:bold;
    margin-bottom:25px;
}

.input-box{
    margin-top:25px;
}

label{
    font-size:18px;
    font-weight:bold;
}

input{
    width:100%;
    height:60px;
    margin-top:10px;
    padding:10px 15px;
    font-size:24px;
    border-radius:10px;
    border:2px solid #1976D2;
    outline:none;
}

.button-group{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:20px;
}

button{
    width:180px;
    height:55px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.search{
    background:#1976D2;
}

.scan{
    background:#28A745;
}


.card{

    margin-top:30px;
    background:#f8f9fa;
    border-radius:12px;
    padding:20px;
    border:1px solid #ddd;

}


.row{
    margin-bottom:20px;
}


.title{

    color:#666;
    font-size:15px;

}


.value{

    font-size:22px;
    font-weight:bold;
    margin-top:5px;

}


.price{

    color:#d50000;
    font-size:38px;
    font-weight:bold;

}


.footer{

    margin-top:25px;
    text-align:center;
    color:#777;
    font-size:13px;

}


/* AREA SCAN */

#reader{

    display:none;
    margin-top:20px;
    width:100%;
    max-width:380px;
    margin-left:auto;
    margin-right:auto;

    position:relative;

}


#reader video{

    width:100% !important;
    border-radius:15px;

}


</style>


<script>

const API_URL = "https://script.google.com/macros/s/AKfycbw0d1cWaAvS_PWn6XU45K1hrrzTnbWK6jYsD3cMXpWlHrft-Xee2wV9rG3UwfVTBmgv/exec";


const txt = document.getElementById("barcode");


txt.focus();



// ===========================
// CARI PRODUK VIA API
// ===========================

async function cari(){


    let barcode = txt.value.trim();



    if(barcode==""){

        alert("Masukkan Barcode");

        txt.focus();

        return;

    }



    try{


        const response = await fetch(
            API_URL + "?barcode=" + encodeURIComponent(barcode)
        );



        const data = await response.json();



        if(!data){


            document.getElementById("hasilBarcode").innerHTML="-";

            document.getElementById("hasilNama").innerHTML=
            "BARCODE TIDAK DITEMUKAN";

            document.getElementById("hasilHarga").innerHTML="-";


            return;


        }



        document.getElementById("hasilBarcode").innerHTML =
        data.barcode;



        document.getElementById("hasilNama").innerHTML =
        data.nama;



        document.getElementById("hasilHarga").innerHTML =
        "Rp " + Number(data.harga)
        .toLocaleString("id-ID");



        txt.focus();

        txt.select();



    }

    catch(err){


        console.log(err);


        alert("Gagal menghubungi server");


    }



}





// ENTER SEARCH

txt.addEventListener("keypress",function(e){


    if(e.key==="Enter"){

        cari();

    }


});






// ===========================
// SCANNER
// ===========================


let html5QrCode = null;




function scanBarcode(){



    if(html5QrCode){

        return;

    }



    const reader =
    document.getElementById("reader");



    reader.style.display="block";



    html5QrCode =
    new Html5Qrcode("reader");



    Html5Qrcode.getCameras()

    .then(cameras=>{



        if(cameras.length==0){

            alert("Kamera tidak ditemukan");

            return;

        }




        // pilih kamera belakang

        let cameraId =
        cameras[cameras.length-1].id;




        html5QrCode.start(


            cameraId,


            {

                fps:15,


                qrbox:{
                    width:300,
                    height:150
                },


                formatsToSupport:[

                    Html5QrcodeSupportedFormats.EAN_13

                ]

            },



            function(decodedText){



                // isi barcode

                txt.value = decodedText;



                beep();




                stopScanner();




                setTimeout(function(){


                    cari();


                },800);



            },



            function(error){


                // abaikan error scan


            }



        );



    })


    .catch(err=>{


        console.log(err);


        alert(
        "Tidak dapat membuka kamera\n\n"+err
        );


    });



}






// ===========================
// STOP CAMERA
// ===========================


function stopScanner(){



    if(html5QrCode){



        html5QrCode.stop()

        .then(()=>{


            html5QrCode.clear();



            html5QrCode=null;



            document.getElementById("reader")
            .style.display="none";



        })

        .catch(err=>{


            console.log(err);


            html5QrCode=null;


        });



    }


}






// ===========================
// BEEP
// ===========================

function beep(){


    const ctx =
    new (window.AudioContext ||
    window.webkitAudioContext)();



    const osc =
    ctx.createOscillator();



    osc.type="sine";


    osc.frequency.value=900;



    osc.connect(ctx.destination);



    osc.start();



    setTimeout(function(){


        osc.stop();

        ctx.close();


    },120);



}



</script>


</body>

</html>
