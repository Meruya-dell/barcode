<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef2f7;
}

.container{
    width:100%;
    min-height:100vh;
    background:white;
    padding:20px;
}

.header{
    text-align:center;
    color:#1976D2;
    font-size:30px;
    font-weight:bold;
    margin-bottom:25px;
}

.input-box{
    margin-top:25px;
}

label{
    font-size:18px;
    font-weight:bold;
}

input{
    width:100%;
    height:60px;
    margin-top:10px;
    padding:10px 15px;
    font-size:24px;
    border-radius:10px;
    border:2px solid #1976D2;
    outline:none;
}

.button-group{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:20px;
}

button{
    width:180px;
    height:55px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.search{
    background:#1976D2;
}

.scan{
    background:#28A745;
}


.card{

    margin-top:30px;
    background:#f8f9fa;
    border-radius:12px;
    padding:20px;
    border:1px solid #ddd;

}


.row{
    margin-bottom:20px;
}


.title{

    color:#666;
    font-size:15px;

}


.value{

    font-size:22px;
    font-weight:bold;
    margin-top:5px;

}


.price{

    color:#d50000;
    font-size:38px;
    font-weight:bold;

}


.footer{

    margin-top:25px;
    text-align:center;
    color:#777;
    font-size:13px;

}


/* AREA SCAN */

#reader{

    display:none;
    margin-top:20px;
    width:100%;
    max-width:380px;
    margin-left:auto;
    margin-right:auto;

    position:relative;

}


#reader video{

    width:100% !important;
    border-radius:15px;

}


</style>


<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


</head>


<body>


<div class="container">


<div class="header">
CEK HARGA PRODUK
</div>



<div class="input-box">

<label>Barcode</label>

<input
id="barcode"
type="text"
placeholder="Scan / Ketik Barcode">


</div>



<div class="button-group">


<button class="search" onclick="cari()">

🔍 SEARCH

</button>



<button class="scan" onclick="scanBarcode()">

📷 SCAN

</button>


</div>




<div id="reader"></div>





<div class="card">


<div class="row">

<div class="title">
Barcode
</div>

<div class="value" id="hasilBarcode">
-
</div>


</div>




<div class="row">

<div class="title">
Nama Produk
</div>


<div class="value" id="hasilNama">
-
</div>


</div>




<div class="row">

<div class="title">
Harga
</div>


<div class="price" id="hasilHarga">
-
</div>


</div>



</div>




<div class="footer">
EENG IRAWAN WEBSEARCH
</div>



</div>




<script>


const txt=document.getElementById("barcode");


txt.focus();



function cari(){


let barcode=txt.value.trim();



if(barcode==""){

alert("Masukkan Barcode");

return;

}



google.script.run

.withSuccessHandler(function(data){


if(data==null){


hasilBarcode.innerHTML="-";

hasilNama.innerHTML="BARCODE TIDAK DITEMUKAN";

hasilHarga.innerHTML="-";


return;


}



hasilBarcode.innerHTML=data.barcode;

hasilNama.innerHTML=data.nama;

hasilHarga.innerHTML=
"Rp "+Number(data.harga).toLocaleString("id-ID");



txt.focus();

txt.select();



})


.cariProduk(barcode);



}




txt.addEventListener("keypress",function(e){


if(e.key==="Enter"){

cari();

}


});





// ===========================
// SCANNER
// ===========================


let html5QrCode=null;




function scanBarcode(){



if(html5QrCode){

return;

}



document.getElementById("reader").style.display="block";



html5QrCode=new Html5Qrcode("reader");



Html5Qrcode.getCameras()

.then(cameras=>{


let cameraId =
cameras[cameras.length-1].id;




html5QrCode.start(


cameraId,


{


fps:15,


qrbox:{
width:300,
height:150
},



formatsToSupport:[

Html5QrcodeSupportedFormats.EAN_13

]


},



function(decodedText){



txt.value=decodedText;



beep();



stopScanner();



setTimeout(function(){


cari();


},800);



},



function(error){}



);



})

.catch(err=>{


alert(
"Tidak dapat membuka kamera\n\n"+err
);


});



}





function stopScanner(){



if(html5QrCode){



html5QrCode.stop()

.then(()=>{



html5QrCode.clear();



html5QrCode=null;



document.getElementById("reader").style.display="none";



})

.catch(err=>{


console.log(err);


html5QrCode=null;


});



}


}




function beep(){


const ctx=
new (window.AudioContext || window.webkitAudioContext)();



const osc=ctx.createOscillator();


osc.type="sine";

osc.frequency.value=900;


osc.connect(ctx.destination);


osc.start();



setTimeout(function(){


osc.stop();

ctx.close();


},120);



}



</script>


</body>

</html>
